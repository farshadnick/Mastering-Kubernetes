# ============================================================
# Cilium v1.19.3
# Gateway API + Host Network Mode
# ============================================================

# ------------------------------------------------------------
# Kube Proxy Replacement
# ------------------------------------------------------------

kubeProxyReplacement: true

# You do NOT need L2 announcements for Gateway hostNetwork mode.
# Keep these enabled only if other LoadBalancer services need them.
l2announcements:
  enabled: false

externalIPs:
  enabled: false


# ------------------------------------------------------------
# Kubernetes API
# ------------------------------------------------------------

k8sServiceHost: 192.168.100.100
k8sServicePort: 6443


# ------------------------------------------------------------
# Cilium Agent
# ------------------------------------------------------------

image:
  repository: kube.aradarpanet.ir/cilium/cilium
  tag: v1.19.3
  pullPolicy: IfNotPresent
  useDigest: false


# ------------------------------------------------------------
# Cilium Operator
# ------------------------------------------------------------

operator:
  replicas: 2

  image:
    repository: kube.aradarpanet.ir/cilium/operator
    tag: v1.19.3
    pullPolicy: IfNotPresent
    useDigest: false


# ============================================================
# Gateway API - HOST NETWORK MODE
# ============================================================

gatewayAPI:
  enabled: true

  hostNetwork:
    enabled: true

    # Empty selector = expose Gateway listeners on ALL Cilium nodes
    nodes:
      matchLabels: {}

  # Ignored for hostNetwork mode
  externalTrafficPolicy: Cluster


# ============================================================
# Standalone Envoy
# ============================================================

envoy:
  enabled: true

  image:
    repository: kube.aradarpanet.ir/cilium/cilium-envoy

    # IMPORTANT:
    # Correct Envoy image for Cilium 1.19.3
    tag: v1.36.6-1776000132-2437d2edeaf4d9b56ef279bd0d71127440c067aa

    pullPolicy: IfNotPresent
    useDigest: false

  # Required if Gateway listeners use privileged ports
  # such as 80 or 443.
  securityContext:
    privileged: false

    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE

      keepCapNetBindService: true


# ------------------------------------------------------------
# Certgen
# ------------------------------------------------------------

certgen:
  image:
    repository: kube.aradarpanet.ir/cilium/certgen
    tag: v0.4.1
    pullPolicy: IfNotPresent
    useDigest: false


# ============================================================
# Hubble
# ============================================================

hubble:
  enabled: true

  relay:
    enabled: true

    image:
      repository: kube.aradarpanet.ir/cilium/hubble-relay
      tag: v1.19.3
      pullPolicy: IfNotPresent
      useDigest: false

  ui:
    enabled: true

    frontend:
      image:
        repository: kube.aradarpanet.ir/cilium/hubble-ui
        tag: v0.13.3
        pullPolicy: IfNotPresent
        useDigest: false

    backend:
      image:
        repository: kube.aradarpanet.ir/cilium/hubble-ui-backend
        tag: v0.13.3
        pullPolicy: IfNotPresent
        useDigest: false


# ============================================================
# CNI
# ============================================================

cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d


# ------------------------------------------------------------
# Masquerading / BPF
# ------------------------------------------------------------

enableIPv4Masquerade: true

bpf:
  masquerade: true


# ------------------------------------------------------------
# Kube Proxy Replacement health endpoint
# ------------------------------------------------------------

kubeProxyReplacementHealthzBindAddr: "0.0.0.0:10256"


# ------------------------------------------------------------
# Cilium Agent Security Context
# ------------------------------------------------------------

# This is your existing setting.
# It is unrelated to Envoy binding 80/443.
securityContext:
  privileged: true


# ------------------------------------------------------------
# Node Init
# ------------------------------------------------------------

nodeinit:
  enabled: false


# ------------------------------------------------------------
# ClusterMesh
# ------------------------------------------------------------

clustermesh:
  useAPIServer: false


# ------------------------------------------------------------
# TLS
# ------------------------------------------------------------

tls:
  enabled: false


# ------------------------------------------------------------
# Authentication
# ------------------------------------------------------------

authentication:
  mutual:
    spire:
      enabled: false


# ------------------------------------------------------------
# Image Pull Secrets
# ------------------------------------------------------------

imagePullSecrets: []
